<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Quick Sort</title>
</head>
<body>
<script>

    /** 排序規則 **/
    // 1. 從 data 中選出一個基準值 (Pivot)
    // 2. Pivot 拿來做比較, 比他'小'的數值移到基準值左邊, 形成左子 data
    // 3. Pivot 拿來做比較, 比他'大'的數值移到基準值右邊, 形成右子 data
    // 4. 分別對這些子 data 重覆執行 1 ~ 3 步驟
    // 5. 直到子 data 只剩一個或沒有, 就排完了

    /** 特性 **/
    // 時間複雜度平均為 O(n log n)
    // 時間複雜度最差的情況為 Ο(n2), 就是 data 已經完整排好了, 等於全部從頭再跑一次多於的動作

    /** 使用兩個 array 實作的版本 **/
        // 缺點:
        // 1. 每次 call 都會使用到兩個 array 空間, 產生空間複雜度
        // 2. 遇到 data 量大效能不佳

    const array = [0, 15, 12, 3, 2, 7, 10, 0, 9, 7, 7, 21, 40, 33, 26, 55, 99, -2]; // 7 3 12 2 15

    function quickSort(data) {
        if (data.length <= 1) {
            return data;
        }

        let leftArray = [];
        let rightArray = [];
        let pivot = data[0];

        for (let i = 1; i < data.length; i++) {
            if (data[i] < pivot) {
                leftArray.push(data[i]);
            } else {
                rightArray.push(data[i]);
            }
        }

        return [...quickSort(leftArray), pivot, ...quickSort(rightArray)];
    }


    function partition(data, left, right) {
        const value = data[right];
        let i = left

        for (let j = left; j < right; j++) {
            if (data[j] < value) {
                [data[i], data[j]] = [data[j], data[i]];
                i++;
            }
        }

        [data[i], data[right]] = [data[right], data[i]];

        return i;
    }

    function quick(arr) {
        if (!Array.isArray(arr) || arr.length <= 1) {
            return arr;
        }

        const stack = [];
        stack.push({left: 0, right: arr.length - 1});

        while (stack.length > 0) {
            const {left, right} = stack.pop();

            if (left >= right) {
                continue;
            }

            const pIndex = partition(arr, left, right);

            stack.push({left: left, right: pIndex - 1});
            stack.push({left: pIndex + 1, right: right});
        }

        return arr;
    }

    console.log(quick(array))
</script>
</body>
</html>
